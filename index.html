<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Piggy - מעקב תזונה</title>
    <!-- אייקון מותאם למסך הבית באייפון -->
    <link rel="apple-touch-icon" href="https://api.iconify.design/noto:pig.svg">
    <link rel="icon" href="https://api.iconify.design/noto:pig.svg">
    <style>
        :root {
            --bg-color: #fff0f3;
            --primary-color: #ff758c;
            --secondary-color: #ff7eb3;
            --text-color: #4a4a4a;
            --card-bg: #ffffff;
        }
        [data-theme="blue"] {
            --bg-color: #f0f4ff;
            --primary-color: #4facfe;
            --secondary-color: #00f2fe;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button.theme-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }
        .user-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .user-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #f9f9f9;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .user-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .log-list {
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
        }
        .log-item {
            background: #fcfcfc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-right: 4px solid var(--primary-color);
            font-size: 14px;
        }
    </style>
</head>
<body data-theme="pink">

    <div class="container">
        <header>
            <h1>🐷 Piggy</h1>
            <button class="theme-btn" onclick="toggleTheme()" id="themeIcon">🌸</button>
        </header>

        <div class="user-selector">
            <button class="user-btn active" id="userTal" onclick="setUser('Tal')">טל 🩵</button>
            <button class="user-btn" id="userOla" onclick="setUser('Ola')">אולה 🌸</button>
        </div>

        <input type="text" id="foodInput" placeholder="מה אכלת היום? (לדוגמה: סלט, פיצה...)">
        <button class="action-btn" onclick="addEntry()">הוסף רישום 🐷</button>

        <div class="log-list" id="logList"></div>
    </div>

    <script>
        let currentUser = 'Tal';
        let currentTheme = 'pink';

        function setUser(user) {
            currentUser = user;
            document.getElementById('userTal').classList.toggle('active', user === 'Tal');
            document.getElementById('userOla').classList.toggle('active', user === 'Ola');
            renderLogs();
        }

        function toggleTheme() {
            const body = document.body;
            if (currentTheme === 'pink') {
                currentTheme = 'blue';
                body.setAttribute('data-theme', 'blue');
                document.getElementById('themeIcon').innerText = '🩵';
            } else {
                currentTheme = 'pink';
                body.setAttribute('data-theme', 'pink');
                document.getElementById('themeIcon').innerText = '🌸';
            }
            localStorage.setItem('piggy_theme', currentTheme);
        }

        function addEntry() {
            const input = document.getElementById('foodInput');
            const text = input.value.trim();
            if (!text) return;

            const logs = JSON.parse(localStorage.getItem('piggy_logs') || '[]');
            logs.unshift({
                user: currentUser,
                text: text,
                date: new Date().toLocaleTimeString('he-IL', { hour: '2-35', minute: '2-digit', hour12: false })
            });

            localStorage.setItem('piggy_logs', JSON.stringify(logs));
            input.value = '';
            renderLogs();
        }

        function renderLogs() {
            const logs = JSON.parse(localStorage.getItem('piggy_logs') || '[]');
            const list = document.getElementById('logList');
            list.innerHTML = '';

            logs.forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `<strong>${log.user}:</strong> ${log.text} <span style="font-size:11px; color:#888; float:left;">${log.date}</span>`;
                list.appendChild(div);
            });
        }

        // טעינת הגדרות שמורות
        window.onload = function() {
            const savedTheme = localStorage.getItem('piggy_theme');
            if (savedTheme === 'blue') {
                toggleTheme();
            }
            renderLogs();
        };
    </script>
</body>
</html>
